<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Inventario - Librería</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="card shadow">
            <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
                <h3 class="mb-0"><i class="bi bi-book-half text-primary"></i> Inventario de Libros</h3>
                <div>
                    <a href="{% url 'crear_libro' %}" class="btn btn-primary fw-bold"><i class="bi bi-plus-lg"></i> Agregar Libro</a>
                    <button id="btnCerrarSesion" class="btn btn-danger fw-bold ms-2"><i class="bi bi-box-arrow-right"></i> Salir</button>
                </div>
            </div>
            <div class="card-body">
                <p id="mensaje" class="text-center fw-bold mt-3">Cargando inventario...</p>
                <table class="table table-hover text-center align-middle" id="tabla-libros" style="display: none;">
                    <thead class="table-light">
                        <tr>
                            <th>Título</th>
                            <th>Autor</th>
                            <th>Precio</th>
                            <th>Stock</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="cuerpo-tabla">
                        <!-- Las filas se inyectarán con JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const cuerpoTabla = document.getElementById('cuerpo-tabla');
        const mensaje = document.getElementById('mensaje');
        const tablaLibros = document.getElementById('tabla-libros');
        const token = sessionStorage.getItem('token');

        // Si no hay token, lo devolvemos al login
        if (!token) {
            window.location.href = '/';
        }

        async function cargarLibros() {
            try {
                const respuesta = await fetch('/api/libros/', {
                    method: 'GET',
                    headers: {
                        'Authorization': `Token ${token}`
                    }
                });

                if (respuesta.status === 401 || respuesta.status === 403) {
                    sessionStorage.removeItem('token');
                    window.location.href = '/';
                    return;
                }

                const libros = await respuesta.json();
                mensaje.style.display = 'none';
                tablaLibros.style.display = 'table';

                if (libros.length === 0) {
                    cuerpoTabla.innerHTML = '<tr><td colspan="5" class="text-center text-muted py-4">No hay libros en el inventario.</td></tr>';
                    return;
                }

                libros.forEach(libro => {
                    const fila = document.createElement('tr');
                    
                    let stockBadge = libro.stock > 0 
                        ? `<span class="badge bg-success rounded-pill">Disp: ${libro.stock}</span>` 
                        : `<span class="badge bg-danger rounded-pill">Agotado</span>`;

                    fila.innerHTML = `
                        <td class="text-start fw-bold">${libro.titulo}</td>
                        <td>${libro.autor}</td>
                        <td class="text-success fw-bold">$${libro.precio}</td>
                        <td>${stockBadge}</td>
                        <td>
                            <a href="/editar/${libro.id}/" class="btn btn-warning btn-sm"><i class="bi bi-pencil"></i> Editar</a>
                            <a href="/eliminar/${libro.id}/" class="btn btn-danger btn-sm"><i class="bi bi-trash"></i> Eliminar</a>
                        </td>
                    `;
                    cuerpoTabla.appendChild(fila);
                });

            } catch (error) {
                mensaje.textContent = 'Error de conexión con el servidor.';
                mensaje.className = 'text-center fw-bold text-danger mt-3';
            }
        }

        document.getElementById('btnCerrarSesion').addEventListener('click', () => {
            sessionStorage.removeItem('token');
            window.location.href = '/';
        });

        cargarLibros();
    </script>
</body>
</html>
