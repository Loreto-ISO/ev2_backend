<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Editar Libro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>input { width: 100%; padding: 8px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 5px; }</style>
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center"><div class="col-md-6">
            <div class="card shadow border-warning">
                <div class="card-header bg-warning text-dark fw-bold"><h4 class="mb-0">Editar Libro: {{ libro.titulo }}</h4></div>
                <div class="card-body">
                    <form method="POST">
                        {% csrf_token %}
                        {{ form.as_p }}
                        <div class="d-grid gap-2 mt-3">
                            <button type="submit" class="btn btn-warning fw-bold text-dark">Eliminar Libro</button>
                            <a href="{% url 'inicio' %}" class="btn btn-outline-secondary">Cancelar</a>
                        </div>
                    </form>
                </div>
            </div>
        </div></div>
    </div>
</body>
</html>
