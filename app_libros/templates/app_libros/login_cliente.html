{% extends "app_libros/base.html" %}

{% block title %}
Iniciar sesión | Librería Doña Zoyla
{% endblock %}

{% block content %}

<section class="registro-seccion">

    <div class="registro-tarjeta">

        <h1>Iniciar sesión</h1>

        <p class="registro-subtitulo">
            Bienvenido a Librería Doña Zoyla
        </p>

        <form
            method="post"
            action="{% url 'login' %}"
            class="registro-formulario"
        >
            {% csrf_token %}

            <div class="campo-formulario">
                <label for="username">
                    Nombre de usuario
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    value="{{ username|default:'' }}"
                    minlength="4"
                    maxlength="30"
                    autocomplete="username"
                    placeholder="Ingresa tu usuario"
                    required
                >
            </div>

            <div class="campo-formulario">
                <label for="password">
                    Contraseña
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    minlength="8"
                    maxlength="128"
                    autocomplete="current-password"
                    placeholder="Ingresa tu contraseña"
                    required
                >
            </div>

            <button
                type="submit"
                class="boton boton--registro"
            >
                Iniciar sesión
            </button>

        </form>

        <p class="enlace-sesion">
            ¿Todavía no tienes una cuenta?

            <a href="{% url 'registro' %}">
                Regístrate aquí
            </a>
        </p>

    </div>

</section>

{% endblock %}
