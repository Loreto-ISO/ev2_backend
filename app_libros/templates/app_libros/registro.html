<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Librería</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="min-height: 100vh;">
    <div class="card shadow-lg border-0 rounded-4" style="width: 100%; max-width: 400px;">
        <div class="card-body p-5 text-center">
            <h3 class="fw-bold text-success mb-1"><i class="bi bi-person-plus-fill"></i> Crear Cuenta</h3>
            <p class="text-muted mb-4">Librería Doña Zoyla</p>

            <form id="formRegistro">
                <div class="form-floating mb-3 text-start">
                    <input type="text" class="form-control" id="username" placeholder="Usuario nuevo" required>
                    <label for="username">Crea tu usuario</label>
                </div>
                <div class="form-floating mb-4 text-start">
                    <input type="password" class="form-control" id="password" placeholder="Contraseña nueva" required minlength="8">
                    <label for="password">Crea tu Contraseña</label>
                </div>
                <button type="submit" class="btn btn-success w-100 py-2 fw-bold">Registrarse</button>
            </form>
            
            <div id="mensaje" class="mt-3 fw-bold"></div>
            
            <div class="mt-4">
                <a href="/" class="text-decoration-none">¿Ya tienes cuenta? Inicia sesión aquí</a>
            </div>
        </div>
    </div>

    <script>
        const formulario = document.getElementById('formRegistro');
        const mensaje = document.getElementById('mensaje');

        formulario.addEventListener('submit', async function(event) {
            event.preventDefault();
            mensaje.textContent = 'Creando usuario...';
            mensaje.className = 'mt-3 fw-bold text-secondary';

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                const respuesta = await fetch('/api/registro/', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({username, password})
                });

                const datos = await respuesta.json();

                if (respuesta.ok) {
                    mensaje.textContent = datos.mensaje;
                    mensaje.className = 'mt-3 fw-bold text-success';
                    formulario.reset();
                    // Redirige al login después de 2 segundos
                    setTimeout(() => { window.location.href = '/'; }, 2000);
                } else {
                    mensaje.textContent = datos.error || 'Error al registrar usuario';
                    mensaje.className = 'mt-3 fw-bold text-danger';
                }
            } catch (error) {
                mensaje.textContent = 'Error de conexión con el servidor.';
                mensaje.className = 'mt-3 fw-bold text-danger';
            }
        });
    </script>
</body>
</html>
