<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Crear Libro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white">
                        <h4 class="mb-0">Agregar Nuevo Libro</h4>
                    </div>
                    <div class="card-body">
                        <form id="formCrear">
                            <div class="mb-3">
                                <label class="fw-bold">Título:</label>
                                <input type="text" id="titulo" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label class="fw-bold">Autor:</label>
                                <input type="text" id="autor" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label class="fw-bold">Precio ($):</label>
                                <input type="number" id="precio" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label class="fw-bold">Stock en Bodega:</label>
                                <input type="number" id="stock" class="form-control" required>
                            </div>
                            <div class="d-grid gap-2 mt-4">
                                <button type="submit" class="btn btn-primary fw-bold">Guardar Libro </button>
                                <a href="/libros/" class="btn btn-outline-secondary">Cancelar</a>
                            </div>
                        </form>
                        <p id="mensaje" class="mt-3 text-center fw-bold"></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const token = sessionStorage.getItem('token');
        if (!token) { window.location.href = '/'; }

        document.getElementById('formCrear').addEventListener('submit', async function(event) {
            event.preventDefault();
            const mensaje = document.getElementById('mensaje');
            
            const nuevoLibro = {
                titulo: document.getElementById('titulo').value,
                autor: document.getElementById('autor').value,
                precio: document.getElementById('precio').value,
                stock: document.getElementById('stock').value
            };

            try {
                const respuesta = await fetch('/api/libros/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Token ${token}`
                    },
                    body: JSON.stringify(nuevoLibro)
                });

                const datos = await respuesta.json();

                if (respuesta.ok) {
                    mensaje.textContent = '¡Libro guardado correctamente!';
                    mensaje.className = 'mt-3 text-center fw-bold text-success';
                    setTimeout(() => window.location.href = '/libros/', 1000);
                } else {
                    // Muestra los errores de validación de modelos (precio máximo, etc)
                    mensaje.textContent = datos.error || JSON.stringify(datos);
                    mensaje.className = 'mt-3 text-center fw-bold text-danger';
                }
            } catch (error) {
                mensaje.textContent = 'Error de conexión.';
                mensaje.className = 'mt-3 text-center fw-bold text-danger';
            }
        });
    </script>
</body>
</html>
