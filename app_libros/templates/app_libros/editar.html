<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Editar Libro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow border-warning">
                    <div class="card-header bg-warning text-dark fw-bold">
                        <h4 class="mb-0" id="titulo-cabecera">Cargando datos...</h4>
                    </div>
                    <div class="card-body">
                        <form id="formEditar" style="display: none;">
                            <div class="mb-3">
                                <label class="fw-bold">Título:</label>
                                <input type="text" id="titulo" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label class="fw-bold">Autor:</label>
                                <input type="text" id="autor" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label class="fw-bold">Precio ($):</label>
                                <input type="number" id="precio" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label class="fw-bold">Stock en Bodega:</label>
                                <input type="number" id="stock" class="form-control" required>
                            </div>
                            <div class="d-grid gap-2 mt-4">
                                <button type="submit" class="btn btn-warning fw-bold text-dark">Actualizar Libro</button>
                                <a href="/libros/" class="btn btn-outline-secondary">Cancelar</a>
                            </div>
                        </form>
                        <p id="mensaje" class="mt-3 text-center fw-bold"></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const token = sessionStorage.getItem('token');
        if (!token) { window.location.href = '/'; }

        const urlParts = window.location.pathname.split('/').filter(Boolean);
        const libroId = urlParts[urlParts.length - 1]; // Obtiene el ID de la URL
        const formEditar = document.getElementById('formEditar');
        const mensaje = document.getElementById('mensaje');

        // 1. Consultar el libro existente
        async function cargarLibro() {
            try {
                const respuesta = await fetch(`/api/libros/${libroId}/`, {
                    headers: { 'Authorization': `Token ${token}` }
                });
                
                if (respuesta.ok) {
                    const libro = await respuesta.json();
                    document.getElementById('titulo-cabecera').textContent = `Editar Libro: ${libro.titulo}`;
                    document.getElementById('titulo').value = libro.titulo;
                    document.getElementById('autor').value = libro.autor;
                    document.getElementById('precio').value = libro.precio;
                    document.getElementById('stock').value = libro.stock;
                    formEditar.style.display = 'block';
                } else {
                    mensaje.textContent = 'Libro no encontrado.';
                    mensaje.className = 'text-danger';
                }
            } catch (error) {
                mensaje.textContent = 'Error de conexión.';
            }
        }

        // 2. Enviar los cambios por PUT
        formEditar.addEventListener('submit', async function(event) {
            event.preventDefault();
            const datosActualizados = {
                titulo: document.getElementById('titulo').value,
                autor: document.getElementById('autor').value,
                precio: document.getElementById('precio').value,
                stock: document.getElementById('stock').value
            };

            try {
                const respuesta = await fetch(`/api/libros/${libroId}/`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Token ${token}`
                    },
                    body: JSON.stringify(datosActualizados)
                });

                const datos = await respuesta.json();

                if (respuesta.ok) {
                    mensaje.textContent = '¡Libro actualizado correctamente!';
                    mensaje.className = 'mt-3 text-center fw-bold text-success';
                    setTimeout(() => window.location.href = '/libros/', 1000);
                } else {
                    mensaje.textContent = datos.error || JSON.stringify(datos);
                    mensaje.className = 'mt-3 text-center fw-bold text-danger';
                }
            } catch (error) {
                mensaje.textContent = 'Error al actualizar.';
                mensaje.className = 'mt-3 text-center fw-bold text-danger';
            }
        });

        cargarLibro();
    </script>
</body>
</html>
